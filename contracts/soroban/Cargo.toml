[workspace]
resolver = "2"
members = [
  "contracts/campaign_treasury",
  "contracts/contributor_identity",
  "contracts/crowdpay",
  "contracts/escrow",
  "contracts/fee_registry",
  "contracts/migration",
  "contracts/milestones",
  "contracts/milestones_v2",
]
# contracts/matching_pool holds a bare lib.rs with no Cargo.toml and no src/
# layout, so it is excluded until that contract is given a manifest.
exclude = [
  "contracts/matching_pool",
]

[workspace.dependencies]
soroban-sdk = "21.3.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
