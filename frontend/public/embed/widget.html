<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowdPay Campaign Embed Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    :root {
      --bg: #ffffff;
      --card-bg: #f9fafb;
      --text-main: #111827;
      --text-muted: #6b7280;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --border: #e5e7eb;
      --radius: 12px;
    }
    body.theme-dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #34d399;
      --border: #334155;
    }
    body { background: var(--bg); color: var(--text-main); padding: 16px; width: 100%; transition: background-color 0.2s ease, color 0.2s ease; }
    .widget-container { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; background: var(--card-bg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .title { font-size: 1.125rem; font-weight: 700; line-height: 1.3; color: var(--text-main); margin-bottom: 6px; }
    .description { font-size: 0.875rem; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; margin-bottom: 12px; }
    .progress-track { width: 100%; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; margin-bottom: 12px; position: relative; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--success)); border-radius: 5px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 14px; }
    .stat-val { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .form-group { display: flex; gap: 8px; margin-top: 10px; }
    .input-amount { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text-main); font-size: 0.875rem; outline: none; }
    .select-asset { padding: 8px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text-main); font-size: 0.875rem; outline: none; }
    .btn-contribute { padding: 8px 16px; background: var(--primary); color: #ffffff; border: none; border-radius: 6px; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: background-color 0.15s ease, transform 0.1s ease; }
    .btn-contribute:hover { background: var(--primary-hover); }
    .btn-contribute:active { transform: scale(0.97); }
    .celebration { display: none; margin-top: 10px; padding: 10px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); border-radius: 6px; color: var(--success); font-size: 0.875rem; font-weight: 600; text-align: center; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="widget-container" id="widget">
    <h2 class="title" id="title">Loading Campaign...</h2>
    <p class="description" id="description"></p>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="stats-grid">
      <div>
        <div class="stat-val" id="raisedAmount">$0</div>
        <div>raised of <span id="goalAmount">$0</span></div>
      </div>
      <div>
        <div class="stat-val" id="percentFunded">0%</div>
        <div><span id="daysRemaining">0</span> days left • <span id="contributorCount">0</span> backers</div>
      </div>
    </div>

    <form id="contribForm" class="form-group" onsubmit="handleContribution(event)">
      <input type="number" id="contribAmount" class="input-amount" placeholder="Amount" min="1" step="any" required />
      <select id="contribAsset" class="select-asset">
        <option value="USDC">USDC</option>
        <option value="XLM">XLM</option>
      </select>
      <button type="submit" class="btn-contribute" id="submitBtn">Contribute</button>
    </form>

    <div class="celebration" id="celebration">
      🎉 Contribution Confirmed! Thank you!
    </div>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const campaignId = urlParams.get('campaignId');
      const theme = urlParams.get('theme');

      if (theme === 'dark') {
        document.body.classList.add('theme-dark');
      }

      let campaignData = null;

      function sendResize() {
        const height = document.body.scrollHeight;
        window.parent.postMessage({ type: 'CROWDPAY_RESIZE', height }, '*');
      }

      function notifyParent(type, payload = {}) {
        window.parent.postMessage({ type, campaignId, ...payload }, '*');
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'CROWDPAY_SET_THEME') {
          if (e.data.theme === 'dark') {
            document.body.classList.add('theme-dark');
          } else {
            document.body.classList.remove('theme-dark');
          }
          sendResize();
        }
      });

      async function fetchCampaign() {
        if (!campaignId || !token) {
          document.getElementById('title').textContent = 'Error: Missing Token or Campaign ID';
          return;
        }

        try {
          const apiBase = window.location.origin;
          const res = await fetch(`${apiBase}/api/embed/campaigns/${campaignId}`, {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });

          if (!res.ok) {
            document.getElementById('title').textContent = 'Unable to load campaign embed';
            return;
          }

          campaignData = await res.json();
          renderWidget(campaignData);
          notifyParent('CROWDPAY_READY');
          sendResize();
        } catch (err) {
          document.getElementById('title').textContent = 'Failed to load campaign';
        }
      }

      function renderWidget(data) {
        document.getElementById('title').textContent = data.title || 'Campaign';
        document.getElementById('description').textContent = data.description || '';
        document.getElementById('raisedAmount').textContent = `$${(data.totalRaised || 0).toLocaleString()}`;
        document.getElementById('goalAmount').textContent = `$${(data.goal || 0).toLocaleString()}`;
        document.getElementById('percentFunded').textContent = `${data.percentFunded || 0}%`;
        document.getElementById('daysRemaining').textContent = data.deadline ? Math.max(0, Math.ceil((new Date(data.deadline) - new Date()) / (1000 * 60 * 60 * 24))) : 30;
        document.getElementById('contributorCount').textContent = data.contributorCount || 0;
        document.getElementById('progressFill').style.width = `${Math.min(100, data.percentFunded || 0)}%`;
      }

      window.handleContribution = async function (e) {
        e.preventDefault();
        const amountInput = document.getElementById('contribAmount');
        const assetSelect = document.getElementById('contribAsset');
        const submitBtn = document.getElementById('submitBtn');
        const celebration = document.getElementById('celebration');

        const amount = Number(amountInput.value);
        const asset = assetSelect.value;
        if (!amount || amount <= 0) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';

        try {
          const apiBase = window.location.origin;
          const res = await fetch(`${apiBase}/api/embed/campaigns/${campaignId}/contribute`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ amount, asset })
          });

          if (!res.ok) {
            const errData = await res.json();
            alert(errData.error || 'Contribution failed');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Contribute';
            return;
          }

          const result = await res.json();

          // Optimistic UI Update
          if (campaignData) {
            campaignData.totalRaised += amount;
            campaignData.contributorCount = (campaignData.contributorCount || 0) + 1;
            if (campaignData.goal > 0) {
              campaignData.percentFunded = Math.min(100, Math.round((campaignData.totalRaised / campaignData.goal) * 1000) / 10);
            }
            renderWidget(campaignData);
          }

          celebration.style.display = 'block';
          sendResize();

          // postMessage within 500ms
          notifyParent('CROWDPAY_CONTRIBUTION_SUCCESS', { amount, asset, txHash: result.txHash });

          if (campaignData && campaignData.totalRaised >= campaignData.goal) {
            notifyParent('CROWDPAY_GOAL_REACHED', { totalRaised: campaignData.totalRaised });
          }

          setTimeout(() => {
            celebration.style.display = 'none';
            amountInput.value = '';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Contribute';
            sendResize();
          }, 3000);

        } catch (err) {
          alert('Network error submitting contribution');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Contribute';
        }
      };

      fetchCampaign();
    })();
  </script>
</body>
</html>
